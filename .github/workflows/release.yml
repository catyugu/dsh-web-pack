name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: checks
        run: npm run check
      - name: version matches the tag
        run: |
          tag="${GITHUB_REF_NAME:-${INPUT_TAG}}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "the tag $tag does not match the manifest version $version" >&2
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: npm auth
        run: |
          npm install --global npm@12
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: stage the bundle
        run: node scripts/stage.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: pack
        run: npm pack
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
