name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: checks
        run: npm run check
      - name: manifest
        run: |
          node -e "const p=require('./package.json'); if (p.dsh?.bundle?.patch !== './cordis.patch.yml') throw new Error('the bundle patch is missing')"
          node -e "for (const name of ['dsh-better-session','dsh-session-cleanup']) { const p=require('./packages/'+name+'/package.json'); if (!p.dsh?.client?.platform) throw new Error(name+' has no browser half'); if (!p.exports['.']) throw new Error(name+' has no host entry') }"
